# Daily, ahead of the maintenance agent's run (docs/maintenance.md), which
# reviews, fixes up, and merges these PRs. Minor and patch bumps are grouped per
# ecosystem to keep the merge queue short; majors stay separate so each gets its
# own migration and review.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Los_Angeles"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Los_Angeles"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Los_Angeles"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Los_Angeles"
    groups:
      site-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # While the site is on a TypeScript beta, Dependabot also offers the
      # daily nightlies, because "7.1.0-dev.*" sorts above "7.1.0-beta".
      # Skip them and wait for the next beta, RC, or stable release. The
      # range ends at "7.1.0-e" so it covers every "-dev" build but no "-rc".
      - dependency-name: "typescript"
        versions: [">=7.1.0-dev <7.1.0-e"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Los_Angeles"
