name: Site build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect site build inputs
        id: inputs
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD \
            | grep -qE '^(site/|docs/user-guide/|\.github/workflows/site-build\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.inputs.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        if: steps.inputs.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci
          npm run check
          npm run build
