name: Site build

# The public homepage and guide have their own toolchain, so a pull request or
# merge group that touches them builds them. A merge group whose tree the pull
# request already proved skips, like every other check.

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # The merge group skip resolves the queued pull request's head tree.
  pull-requests: read

concurrency:
  # A pull request ref is stable across force pushes and each merge group has
  # its own ref, so this cancels a superseded run without touching another
  # queued group.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: skip
        uses: ./.github/actions/merge-group-skip

      - name: Detect site build inputs
        id: inputs
        if: steps.skip.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '^(site/|docs/user-guide/|\.github/workflows/site-build\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.inputs.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        if: steps.inputs.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci
          npm run check
          npm run build
